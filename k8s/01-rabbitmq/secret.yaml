# SECRET: credenciales del broker.
# OJO: un Secret solo está codificado en base64, NO cifrado de cara al usuario.
# `stringData` permite escribirlo en texto plano; Kubernetes lo guarda en base64.
# En producción: Azure Key Vault + Secrets Store CSI Driver / Workload Identity.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: aks-store
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: aks-store
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: username
  RABBITMQ_DEFAULT_PASS: password
