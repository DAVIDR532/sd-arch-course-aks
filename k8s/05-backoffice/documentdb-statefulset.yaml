# DocumentDB (compatible con la API de MongoDB): persiste los pedidos
# procesados por makeline-service.
# (Demo: sin PersistentVolumeClaim. En producción: PVC con StorageClass de
#  Azure Disk, o mejor aún un servicio PaaS como Azure Cosmos DB.)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: documentdb
  namespace: aks-store
  labels:
    app: documentdb
    app.kubernetes.io/part-of: aks-store
    app.kubernetes.io/component: database
spec:
  serviceName: documentdb
  replicas: 1
  selector:
    matchLabels:
      app: documentdb
  template:
    metadata:
      labels:
        app: documentdb
        app.kubernetes.io/part-of: aks-store
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: documentdb
          image: __ACR_LOGIN_SERVER__/documentdb/documentdb-local:pg17-0.112.0
          args:
            - "--username"
            - "username"
            - "--password"
            - "password"
          ports:
            - containerPort: 10260
              name: documentdb
          resources:
            requests:
              cpu: 5m
              memory: 75Mi
            limits:
              cpu: 250m
              memory: 1024Mi
          startupProbe:
            tcpSocket:
              port: 10260
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 10260
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 10260
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
