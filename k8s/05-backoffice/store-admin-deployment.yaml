# store-admin (Vue + nginx): portal interno para ver/completar pedidos
# y administrar productos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-admin
  namespace: aks-store
  labels:
    app: store-admin
    app.kubernetes.io/part-of: aks-store
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-admin
  template:
    metadata:
      labels:
        app: store-admin
        app.kubernetes.io/part-of: aks-store
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: store-admin
          image: __ACR_LOGIN_SERVER__/aks-store-demo/store-admin:2.2.0
          ports:
            - containerPort: 8081
              name: store-admin
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
