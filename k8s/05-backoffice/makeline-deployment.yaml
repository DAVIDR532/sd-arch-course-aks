# makeline-service (Go): consume la cola "orders" de RabbitMQ, guarda los
# pedidos en DocumentDB y expone la API que usa store-admin para completarlos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: makeline-service
  namespace: aks-store
  labels:
    app: makeline-service
    app.kubernetes.io/part-of: aks-store
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: makeline-service
  template:
    metadata:
      labels:
        app: makeline-service
        app.kubernetes.io/part-of: aks-store
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: makeline-service
          image: __ACR_LOGIN_SERVER__/aks-store-demo/makeline-service:2.2.0
          ports:
            - containerPort: 3001
          env:
            - name: ORDER_QUEUE_URI
              value: "amqp://rabbitmq:5672"
            # Otra forma de consumir un Secret: clave por clave (secretKeyRef)
            - name: ORDER_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: ORDER_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: ORDER_DB_URI
              value: "mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true"
            - name: ORDER_DB_NAME
              value: "orderdb"
            - name: ORDER_DB_COLLECTION_NAME
              value: "orders"
            - name: ORDER_DB_USERNAME
              value: "username"
            - name: ORDER_DB_PASSWORD
              value: "password"
          resources:
            requests:
              cpu: 1m
              memory: 6Mi
            limits:
              cpu: 50m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /liveness
              port: 3001
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: 3001
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
