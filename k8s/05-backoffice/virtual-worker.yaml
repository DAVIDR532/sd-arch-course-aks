# Simulador: "completa" pedidos llamando a makeline-service,
# como si fuera un empleado despachando órdenes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-worker
  namespace: aks-store
  labels:
    app: virtual-worker
    app.kubernetes.io/part-of: aks-store
    app.kubernetes.io/component: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual-worker
  template:
    metadata:
      labels:
        app: virtual-worker
        app.kubernetes.io/part-of: aks-store
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: virtual-worker
          image: __ACR_LOGIN_SERVER__/aks-store-demo/virtual-worker:2.2.0
          env:
            - name: MAKELINE_SERVICE_URL
              value: http://makeline-service:3001
            - name: ORDERS_PER_HOUR
              value: "100"
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              cpu: 2m
              memory: 20Mi
